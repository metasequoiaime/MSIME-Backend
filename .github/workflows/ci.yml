name: Go 后端验证
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: python3 scripts/sync_contract.py --check
      - run: python3 scripts/generate_openapi.py --check
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/msime-server
